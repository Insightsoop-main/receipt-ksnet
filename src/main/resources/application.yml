# production 실 운영 환경
---
spring:
  config:
    activate:
      on-profile: production
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: true
      connection-timeout: 10000
      maximum-pool-size: 20
      minimum-idle: 3
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
server:
  port: 8080

ksnet:
  registration:
    bearer-token: ${KSNET_REGISTRATION_TOKEN}